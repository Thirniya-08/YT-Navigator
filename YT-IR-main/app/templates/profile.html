{% extends "base.html" %}

{% block title %}Profile{% endblock title %}

{% block content %}
<div class="min-h-screen bg-[var(--bg-color)] text-[var(--text-color)] py-8 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-2xl mx-auto bg-white shadow-lg rounded-xl overflow-hidden border border-gray-200">
        <div class="p-6">
            <h2 class="text-xl font-bold text-gray-800 mb-6">Edit Profile</h2>
            <form method="post" class="space-y-6">
                {% csrf_token %}

                <!-- Username Field -->
                <div class="space-y-2">
                    <label for="id_username" class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" name="username" id="id_username"
                        class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-white text-gray-800 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-yt-red focus:border-transparent"
                        value="{{ user.username }}" required>
                </div>

                <!-- Email Field -->
                <div class="space-y-2">
                    <label for="id_email" class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" name="email" id="id_email"
                        class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-white text-gray-800 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-yt-red focus:border-transparent"
                        value="{{ user.email }}" required>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-yt-red hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-yt-red transition-colors">
                    Save Changes
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
