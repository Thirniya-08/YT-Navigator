{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="YT Navigator - Intelligent YouTube Channel Analysis and Interaction Platform">
  <meta name="keywords" content="YouTube, AI, channel analysis, video search, chatbot, content exploration">
  <title>{% block title %}Main{% endblock title %} | YT Content Dive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://kit.fontawesome.com/29b4e38e6e.js" crossorigin="anonymous"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'yt-red': '#DE1A58',
            'yt-black': '#333333',
            'yt-gray': '#00FFF0',
            'yt-light': '#FFFFFF'
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');

    :root {
      --bg-color: #FFFFFF;
      --text-color: #333333;
      --muted-text-color: #666666;
      --accent-color: #DE1A58;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
    }
  </style>
  <link rel="icon" type="image/x-icon" href="{% static 'images/youtube-favicon.ico' %}">
</head>

<body class="min-h-screen bg-[var(--bg-color)] text-[var(--text-color)]">
  <!-- Navigation Bar -->
  <nav class="bg-[var(--bg-color)] shadow-md fixed w-full top-0 z-50 border-b border-gray-200">
    <div class="container mx-auto px-4">
      <div class="flex justify-between items-center h-14">
        <!-- Logo and Brand -->
        <div class="flex items-center space-x-4">
          <a href="{% url 'app:home' %}" class="flex items-center space-x-2">
            <i class="fab fa-youtube text-yt-red text-3xl"></i>
            <span class="font-bold text-xl text-gray-800">YT Content Dive</span>
          </a>
          <span class="text-gray-600 text-xs">Deep</span>
        </div>

        <!-- Navigation Links -->
        <div class="hidden md:flex items-center space-x-6">
          <a href="{% url 'app:home' %}" class="text-gray-600 hover:text-yt-red transition-colors">Home</a>
          <a href="#" class="text-gray-600 hover:text-yt-red transition-colors">Query</a>
          <a href="#" class="text-gray-600 hover:text-yt-red transition-colors">Chatbot</a>
        </div>

        <!-- User Menu -->
        <div class="flex items-center space-x-4">
          <a href="{% url 'app:login' %}" class="text-gray-600 hover:text-yt-red transition-colors">Login</a>
          <a href="{% url 'app:register' %}"
            class="bg-yt-red text-white px-4 py-2 rounded-md hover:bg-red-600 transition-colors">
            Sign Up
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container mx-auto px-4 pt-20 pb-8 min-h-screen flex items-center justify-center">
    {% block content %}
    {% endblock content %}
  </main>

  <!-- Footer -->
  <footer class="bg-yt-black border-t border-yt-gray mt-auto">
    <div class="container mx-auto px-4 py-6">
      <div class="text-center text-muted-text-color">
        <p>© {% now "Y" %} YT Navigator. All rights reserved.</p>
        <p class="text-sm mt-2">Developed by Wassim EL BAKKOURI</p>
      </div>
    </div>
  </footer>
</body>

</html>
